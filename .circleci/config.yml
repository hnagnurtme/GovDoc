version: 2.1

jobs:
  build_backend_container_image:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Phase 1 - Resolve backend image metadata
          command: |
            set -eu
            SHORT_SHA="$(echo "$CIRCLE_SHA1" | cut -c1-7)"
            REGISTRY="ghcr.io"
            OWNER="${CIRCLE_PROJECT_USERNAME:-hnagnurtme}"
            OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            
            BACKEND_IMAGE="${REGISTRY}/${OWNER_LOWER}/govdoc-backend"
            
            if [ -n "${CIRCLE_TAG:-}" ]; then
              IMAGE_TAGS="$CIRCLE_TAG"
            else
              IMAGE_TAGS="latest $SHORT_SHA"
            fi
            
            echo "export BACKEND_IMAGE=$BACKEND_IMAGE" >> "$BASH_ENV"
            echo "export IMAGE_TAGS='$IMAGE_TAGS'" >> "$BASH_ENV"
            
            echo "Resolved BACKEND_IMAGE=$BACKEND_IMAGE"
            echo "Resolved IMAGE_TAGS=$IMAGE_TAGS"

      - run:
          name: Phase 2 - GitHub Packages (GHCR) login
          command: |
            set -eu
            GH_USER="${GITHUB_USERNAME:-$CIRCLE_PROJECT_USERNAME}"
            GH_TOKEN="${GITHUB_TOKEN:-$GHCR_PAT}"
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "Error: GITHUB_TOKEN or GHCR_PAT environment variable is not set in CircleCI."
              exit 1
            fi
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

      - run:
          name: Phase 3 - Set up Docker Buildx
          command: |
            set -eu
            docker buildx create --use --name multi-platform-builder
            docker buildx inspect --bootstrap

      - run:
          name: Phase 4 - Build & Push multi-platform backend image
          command: |
            set -eu
            . "$BASH_ENV"
            
            BUILD_TAG_ARGS=""
            for tag in $IMAGE_TAGS; do
              BUILD_TAG_ARGS="$BUILD_TAG_ARGS -t $BACKEND_IMAGE:$tag"
            done
            
            # shellcheck disable=SC2086
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f Devops/Dockerfile.backend \
              $BUILD_TAG_ARGS \
              --push .

  build_frontend_container_image:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Phase 1 - Resolve frontend image metadata
          command: |
            set -eu
            SHORT_SHA="$(echo "$CIRCLE_SHA1" | cut -c1-7)"
            REGISTRY="ghcr.io"
            OWNER="${CIRCLE_PROJECT_USERNAME:-hnagnurtme}"
            OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
            
            FRONTEND_IMAGE="${REGISTRY}/${OWNER_LOWER}/govdoc-frontend"
            
            if [ -n "${CIRCLE_TAG:-}" ]; then
              IMAGE_TAGS="$CIRCLE_TAG"
            else
              IMAGE_TAGS="latest $SHORT_SHA"
            fi
            
            echo "export FRONTEND_IMAGE=$FRONTEND_IMAGE" >> "$BASH_ENV"
            echo "export IMAGE_TAGS='$IMAGE_TAGS'" >> "$BASH_ENV"
            
            echo "Resolved FRONTEND_IMAGE=$FRONTEND_IMAGE"
            echo "Resolved IMAGE_TAGS=$IMAGE_TAGS"

      - run:
          name: Phase 2 - GitHub Packages (GHCR) login
          command: |
            set -eu
            GH_USER="${GITHUB_USERNAME:-$CIRCLE_PROJECT_USERNAME}"
            GH_TOKEN="${GITHUB_TOKEN:-$GHCR_PAT}"
            if [ -z "${GH_TOKEN:-}" ]; then
              echo "Error: GITHUB_TOKEN or GHCR_PAT environment variable is not set in CircleCI."
              exit 1
            fi
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_USER" --password-stdin

      - run:
          name: Phase 3 - Set up Docker Buildx
          command: |
            set -eu
            docker buildx create --use --name multi-platform-builder
            docker buildx inspect --bootstrap

      - run:
          name: Phase 4 - Build & Push multi-platform frontend image
          command: |
            set -eu
            . "$BASH_ENV"
            
            BUILD_TAG_ARGS=""
            for tag in $IMAGE_TAGS; do
              BUILD_TAG_ARGS="$BUILD_TAG_ARGS -t $FRONTEND_IMAGE:$tag"
            done
            
            # shellcheck disable=SC2086
            docker buildx build \
              --platform linux/amd64,linux/arm64 \
              -f Devops/Dockerfile.frontend \
              $BUILD_TAG_ARGS \
              --push .


workflows:
  production_release_pipeline:
    jobs:
      - build_backend_container_image:
          name: Build Backend Image
          filters:
            branches:
              only: master
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

      - build_frontend_container_image:
          name: Build Frontend Image
          filters:
            branches:
              only: master
            tags:
              only: /^v[0-9]+\.[0-9]+\.[0-9]+$/

